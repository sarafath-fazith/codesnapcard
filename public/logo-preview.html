<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CodeSnapGC — Logo Preview</title>
<style>
  :root{
    --bg: oklch(0.08 0.01 60);
    --card: oklch(0.12 0.01 60);
    --accent-1: oklch(0.8 0.15 85); /* Gold accent */
    --accent-2: oklch(0.8 0.15 85); /* Gold */
    --muted: oklch(0.65 0.02 60);
    --text: oklch(0.95 0.005 60);
    --glass: rgba(255,255,255,0.04);
  }

  /* Light theme support via .light class on body */
  .light {
    --bg: oklch(0.98 0.005 60);
    --card: oklch(1 0 0);
    --accent-1: oklch(0.75 0.12 85); /* Gold accent */
    --accent-2: oklch(0.75 0.12 85); /* Gold */
    --muted: oklch(0.45 0.02 60);
    --text: oklch(0.12 0.01 60);
    --glass: rgba(11,18,32,0.04);
  }

  html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
  body{
    background: var(--bg);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
  }

  /* Logo container (flexible) */
  .logo-card{
    display:flex;
    align-items:center;
    gap:16px;
    background:linear-gradient(180deg,var(--card), rgba(255,255,255,0.02));
    padding:18px 22px;
    border-radius:14px;
    box-shadow:0 8px 30px rgba(2,6,23,0.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    max-width:720px;
    width:100%;
    align-items:center;
  }

  /* SVG mark size */
  .logo-mark{
    width:64px;
    height:64px;
    flex:0 0 64px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .logo-text {
    font-size: 24px;
    font-weight: bold;
    color: var(--text);
  }
</style>
</head>
<body class="dark">
  <div class="logo-card">
    <div class="logo-mark">
      <img src="placeholder-logo.svg" alt="Logo" style="width: 100%; height: 100%;">
    </div>
    <div class="logo-text">CodeSnapGC</div>
  </div>
</body>
</html>
